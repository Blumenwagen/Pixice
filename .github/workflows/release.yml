name: release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      include_portable:
        description: Also build unsigned Windows and Linux packages
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  prepare-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes "First Pixice beta for macOS." $PRERELEASE_FLAG --title "Pixice $GITHUB_REF_NAME"
          fi

  package:
    needs: [verify, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            target: mac
            arch: arm64
            runtime: darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      PIXICE_RUNTIME_TARGET: ${{ matrix.runtime }}
      PIXICE_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch target runtime
        shell: bash
        run: git lfs pull --include="resources/runtime/${PIXICE_RUNTIME_TARGET}/**" --exclude=""
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - run: pnpm release:preflight
      - run: node scripts/sync-github-cli.mjs --target=${{ matrix.runtime }}
      - run: node scripts/verify-runtime.mjs --target=${{ matrix.runtime }} --require-github-cli
      - run: pnpm exec vite build --mode desktop
      - run: pnpm verify:desktop-renderer
      - run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify signed macOS application
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: pnpm release:verify:macos
      - name: Verify notarized macOS application
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm release:verify:macos -- --require-gatekeeper
      - name: Preserve architecture-specific macOS update metadata
        if: runner.os == 'macOS'
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - name: Upload signed files to draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" release/Pixice-*.dmg release/Pixice-*.zip release/Pixice-*.blockmap release/latest-mac-${{ matrix.arch }}.yml --clobber
      - name: Upload manual-run artifacts
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pixice-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  package-portable:
    if: github.event_name == 'workflow_dispatch' && inputs.include_portable
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: win
            arch: x64
            runtime: win32-x64
          - name: linux-x64
            os: ubuntu-24.04
            target: linux
            arch: x64
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      PIXICE_RUNTIME_TARGET: ${{ matrix.runtime }}
      PIXICE_REQUIRE_SIGNING: 0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch target runtime
        shell: bash
        run: git lfs pull --include="resources/runtime/${PIXICE_RUNTIME_TARGET}/**" --exclude=""
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - run: pnpm release:preflight
      - run: node scripts/sync-github-cli.mjs --target=${{ matrix.runtime }}
      - run: node scripts/verify-runtime.mjs --target=${{ matrix.runtime }} --require-github-cli
      - run: pnpm exec vite build --mode desktop
      - run: pnpm verify:desktop-renderer
      - run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pixice-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files from draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-artifacts
      - name: Prepare macOS update metadata
        run: cp release-artifacts/latest-mac-arm64.yml release-artifacts/latest-mac.yml
      - name: Generate release checksums
        run: node scripts/generate-checksums.mjs release-artifacts
      - name: Finish and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-artifacts/latest-mac.yml release-artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
