name: check

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: project-check
        continue-on-error: true
        run: pnpm check
      - name: Capture workflow preview
        if: steps.project-check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts
          pnpm exec vite --host 127.0.0.1 > /tmp/loom-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          pnpm exec wait-on --timeout 30000 'http://127.0.0.1:5173/?workflow-preview'
          timeout 45s xvfb-run -a env \
            LOOM_CAPTURE_PATH="$PWD/artifacts/workflow-preview.png" \
            LOOM_CAPTURE_WIDTH=1440 \
            LOOM_CAPTURE_HEIGHT=960 \
            pnpm exec electron --no-sandbox --disable-gpu scripts/capture-workflow-preview.mjs
      - name: Upload workflow preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-preview-${{ github.sha }}
          path: artifacts/workflow-preview.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish commit status
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.project-check.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'loom/check',
              description: success ? 'pnpm check passed' : 'pnpm check failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail after publishing status
        if: steps.project-check.outcome != 'success'
        run: exit 1
