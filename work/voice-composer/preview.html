<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Composer review</title>
<style>
body{margin:0;background:#171a1d;color:#eef1f3;font:13px system-ui}header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px}button{color:inherit;background:#30363c;border:1px solid #47505a;padding:6px 10px;border-radius:7px;cursor:pointer}p{margin:8px 12px;color:#b4bec7}#stage{overflow:auto;padding:12px}iframe{display:block;border:1px solid #47505a;border-radius:8px}pre{margin:12px;padding:12px;white-space:pre-wrap;background:#21262a;border-radius:8px}
</style>
<header><strong>Composer review</strong><button id="desktop">Desktop 1320</button><button id="narrow">Narrow 1060</button><button id="main">Task</button><button id="focus">Focus</button><button id="empty">Empty</button><button id="typed">Typed</button><button id="menu">Location menu</button></header>
<p>Development fixture. This renders the real App in an iframe viewport. It does not verify native Voice windows, microphone capture, or real Cloud jobs.</p>
<div id="stage"><iframe id="app" title="Pixice composer preview" width="1320" height="860"></iframe></div><pre id="evidence" aria-live="polite">Loading…</pre>
<script type="module">
import { createWorkspaceStorage } from "/src/connect/execution-storage.js";
const previewStorage=createWorkspaceStorage("local");
let surface='main';const frame=document.querySelector('#app');const evidence=document.querySelector('#evidence');let baseline=null;
const url=()=>`/?${surface==='focus'?'focus-v2-preview':'task-progress-preview'}&devday-preview&composer-idle-preview&focus-idle-preview`;
function load(){baseline=null;previewStorage.setItem('pixice.surfaceMode',surface==='focus'?'focus':'workspace');frame.src=url();}
function rect(element){if(!element)return null;const r=element.getBoundingClientRect();return Object.fromEntries(['x','y','width','height','left','right','top','bottom'].map(k=>[k,Math.round(r[k]*100)/100]));}
function measure(){const d=frame.contentDocument;if(!d?.querySelector('.composer'))return;const composer=d.querySelector('.composer');const location=d.querySelector('.composer-location');const menu=d.querySelector('.composer-location-menu');const primary=d.querySelector('.composer-primary-action');const canvas=d.querySelector('.main-canvas')||d.querySelector('.focus-workspace');const rail=d.querySelector('.focus-task-rail')||d.querySelector('.sidebar');const state={fixture:true,surface:d.querySelector('.focus-workspace')?'focus':'main',viewport:{width:frame.contentWindow.innerWidth,height:frame.contentWindow.innerHeight},primary:primary?.getAttribute('aria-label'),primaryDisabled:primary?.disabled,composerWidthToken:frame.contentWindow.getComputedStyle(composer).getPropertyValue('--conversation-width'),controls:rect(d.querySelector('.composer-controls')),primaryBounds:rect(primary),primaryCount:d.querySelectorAll('.composer-primary-action').length,composer:rect(composer),canvas:rect(canvas),location:rect(location),menu:rect(menu),rail:rect(rail),pageOverflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth};
if(!baseline)baseline=state;state.railUnshifted=JSON.stringify(state.rail)===JSON.stringify(baseline.rail);state.composerFits=state.composer.left>=0&&state.composer.right<=state.viewport.width;state.primaryFits=state.primaryBounds.left>=state.composer.left&&state.primaryBounds.right<=state.composer.right;state.centered=Math.abs((state.composer.left+state.composer.right)/2-(state.canvas.left+state.canvas.right)/2)<2;state.menuFits=!state.menu||(state.menu.left>=0&&state.menu.right<=state.viewport.width&&state.menu.top>=0);state.locationAboveComposer=state.location.bottom<state.composer.top;state.messages=[...d.querySelectorAll('.composer-integration-notice')].map(e=>e.textContent);evidence.textContent=JSON.stringify(state,null,2);}
frame.addEventListener('load',()=>{const observer=new MutationObserver(()=>requestAnimationFrame(measure));observer.observe(frame.contentDocument,{subtree:true,childList:true,attributes:true});const timer=setInterval(()=>{measure();if(frame.contentDocument.querySelector('.composer'))clearInterval(timer)},300);});
for(const [id,width,height] of [['desktop',1320,860],['narrow',1060,720]])document.querySelector('#'+id).onclick=()=>{frame.width=width;frame.height=height;baseline=null;setTimeout(measure,350)};
for(const name of ['main','focus'])document.querySelector('#'+name).onclick=()=>{surface=name;load()};
for(const [id,value] of [['empty',''],['typed','Review the release notes']])document.querySelector('#'+id).onclick=()=>{const win=frame.contentWindow;const input=frame.contentDocument.querySelector('.composer textarea');if(!input)return;Object.getOwnPropertyDescriptor(win.HTMLTextAreaElement.prototype,'value').set.call(input,value);input.dispatchEvent(new win.Event('input',{bubbles:true}));setTimeout(measure,250)};
document.querySelector('#menu').onclick=()=>{frame.contentDocument.querySelector('.composer-location-trigger')?.click();setTimeout(measure,250)};
load();
</script></html>
