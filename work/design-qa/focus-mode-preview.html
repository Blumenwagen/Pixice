<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixice Focus mode</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: #262b31;
      background: #dce9f1;
      --glass: rgba(247, 249, 251, .76);
      --edge: rgba(255, 255, 255, .7);
      --shadow: 0 24px 72px rgba(63, 87, 104, .18), inset 0 1px rgba(255, 255, 255, .74);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, textarea { font: inherit; }
    .focus {
      min-height: 100%;
      position: relative;
      overflow: hidden;
      background: #dce9f1 url("./focus-background.png") center / cover no-repeat;
      isolation: isolate;
    }
    .focus::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(224, 238, 246, .12);
      box-shadow: inset 0 -180px 220px rgba(225, 236, 243, .35);
    }
    .chrome {
      position: absolute;
      top: 22px;
      right: 20px;
      left: 20px;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .glass-control {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      color: rgba(37, 47, 55, .72);
      background: rgba(244, 248, 250, .57);
      border: 1px solid rgba(255, 255, 255, .58);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(75, 98, 114, .1), inset 0 1px rgba(255, 255, 255, .55);
      backdrop-filter: blur(20px) saturate(1.12);
      font-size: 11px;
      font-weight: 650;
      transition: 180ms cubic-bezier(.2, .8, .2, 1);
    }
    button.glass-control { cursor: pointer; }
    button.glass-control:hover { background: rgba(250, 252, 253, .8); transform: translateY(-1px); }
    .back { justify-self: start; }
    .project { justify-self: center; }
    .intro {
      position: absolute;
      top: calc(50% - 120px);
      left: 50%;
      width: min(560px, calc(100% - 40px));
      transform: translate(-50%, -50%);
      text-align: center;
      text-shadow: 0 1px rgba(255, 255, 255, .5);
      animation: intro 700ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .mark {
      width: 35px;
      height: 35px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      color: rgba(62, 83, 98, .72);
      background: rgba(247, 250, 252, .56);
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 12px;
      box-shadow: 0 9px 30px rgba(68, 92, 108, .12);
      backdrop-filter: blur(18px);
    }
    .intro p { margin: 0 0 5px; color: rgba(63, 76, 86, .64); font-size: 11px; font-weight: 620; }
    .intro h1 { margin: 0; font-size: clamp(25px, 3vw, 34px); font-weight: 620; letter-spacing: -.04em; }
    .composer-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(820px, calc(100% - 48px));
      transform: translate(-50%, -4%);
      animation: composer 720ms 80ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .composer {
      padding: 17px 17px 12px;
      background: var(--glass);
      border: 1px solid var(--edge);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(32px) saturate(1.12);
      transition: background 180ms ease, box-shadow 180ms ease, transform 220ms cubic-bezier(.2, .8, .2, 1);
    }
    .composer:focus-within {
      background: rgba(250, 252, 253, .86);
      box-shadow: 0 28px 82px rgba(59, 82, 99, .22), 0 0 0 1px rgba(78, 101, 117, .14);
      transform: translateY(-2px);
    }
    textarea {
      width: 100%;
      min-height: 53px;
      resize: none;
      border: 0;
      outline: 0;
      color: #242a30;
      background: transparent;
      font-size: 15px;
    }
    textarea::placeholder { color: rgba(67, 79, 88, .54); }
    .composer-row { display: flex; align-items: center; gap: 10px; color: rgba(48, 61, 70, .6); font-size: 11px; }
    .attach { border: 0; background: transparent; color: inherit; font-size: 19px; cursor: pointer; }
    .model { margin-left: auto; }
    .mic {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: rgba(48, 61, 70, .66);
      background: transparent;
      cursor: pointer;
      transition: 160ms ease;
    }
    .mic:hover { color: #242a30; background: rgba(42, 57, 68, .055); }
    .mic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .send {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: white;
      background: #343b43;
      box-shadow: 0 4px 12px rgba(35, 44, 51, .18);
      cursor: pointer;
      transition: 180ms ease;
    }
    .send:hover { background: #20262c; transform: translateY(-1px) scale(1.03); }
    @keyframes intro { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    @keyframes composer { from { opacity: 0; transform: translate(-50%, 10px) scale(.985); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 620px) { .label { display: none; } .composer-wrap { width: calc(100% - 24px); } }
  </style>
</head>
<body>
  <main class="focus">
    <header class="chrome">
      <button class="glass-control back" type="button">‹ <span class="label">Workspace</span></button>
      <div class="glass-control project">▢ Pixice⌄</div>
    </header>
    <section class="intro">
      <div class="mark">✦</div>
      <p>One conversation for the whole project</p>
      <h1>Talk to Pixice</h1>
    </section>
    <section class="composer-wrap">
      <div class="composer">
        <textarea aria-label="Project Focus prompt" placeholder="Ask, decide, or start something"></textarea>
        <div class="composer-row">
          <button class="attach" type="button" aria-label="Attach files">＋</button>
          <span>Workspace access⌄</span>
          <span class="model">Astra · Medium⌄</span>
          <button class="mic" type="button" aria-label="Dictate a message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg>
          </button>
          <button class="send" type="button" aria-label="Send">↑</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
